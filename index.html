<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ISCAE Résultats 2026</title>
    
    <!-- مكتبة PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';</script>

    <style>
        :root { 
            --primary: #005C29;
            --secondary: #FFD700;
            --bg-gradient: linear-gradient(135deg, #f0fdf4 0%, #e6f7ed 100%);
            --text: #1a2e1a;
            --radius: 15px;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-gradient); margin: 0; padding: 15px; color: var(--text); direction: rtl; }
        
        header { 
            background: var(--primary); color: white; padding: 15px; 
            text-align: center; border-bottom: 4px solid var(--secondary);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-radius: 0 0 15px 15px;
        }
        
        .container { max-width: 800px; margin: 20px auto; padding: 5px; }
        
        /* صندوق البحث */
        .search-box { 
            background: white; padding: 25px; border-radius: var(--radius); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 30px;
        }

        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: var(--primary); }
        
        select, input { 
            width: 100%; padding: 12px; border: 2px solid #bbf7d0; 
            border-radius: 10px; font-size: 1rem; box-sizing: border-box; outline: none;
        }
        select:focus, input:focus { border-color: var(--primary); }
        
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        
        button { 
            flex: 1; padding: 15px; border: none; border-radius: 10px; 
            font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        
        .btn-search { background: var(--primary); color: white; }
        .btn-top20 { background: var(--secondary); color: #004d22; }
        
        button:hover { transform: translateY(-2px); opacity: 0.95; }

        /* عرض النتائج */
        .result-card { 
            background: white; border-radius: var(--radius); padding: 25px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); display: none; 
            animation: slideUp 0.5s ease; margin-bottom: 30px;
            border-top: 6px solid var(--primary); text-align: right;
        }

        .student-info h2 { color: var(--primary); margin: 0 0 20px 0; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 1.1rem; }
        .info-label { font-weight: bold; color: #555; }
        .info-val { font-weight: bold; color: #000; }

        .decision-valid { color: #059669; background: #d1fae5; padding: 2px 8px; border-radius: 5px; }
        .decision-ratt { color: #dc2626; background: #fee2e2; padding: 2px 8px; border-radius: 5px; }

        .download-btn {
            display: block; width: 100%; text-align: center; 
            background: #1e293b; color: white; padding: 15px; 
            text-decoration: none; border-radius: 10px; margin-top: 25px;
            font-weight: bold; transition: 0.3s; box-sizing: border-box;
        }
        .download-btn:hover { background: #334155; }

        /* الجداول */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; direction: ltr; }
        th { background: #f0fdf4; color: var(--primary); padding: 12px; text-align: left; border-bottom: 2px solid var(--primary); }
        td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
        tr:nth-child(even) { background: #fafafa; }
        
        .loader { display: none; text-align: center; padding: 20px; font-weight: bold; color: var(--primary); }
        .error { color: #dc2626; text-align: center; display: none; margin-top: 10px; padding: 15px; background: #fee2e2; border-radius: 8px; border: 1px solid #fecaca; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        @media (max-width: 600px) {
            .btn-group { flex-direction: column; }
            .info-row { font-size: 1rem; }
        }
    </style>
</head>
<body>

<header>
    <h1>🎓 ISCAE Résultats</h1>
</header>

<div class="container">
    
    <!-- نموذج البحث -->
    <div class="search-box">
        <form id="searchForm">
            <div class="form-group">
                <label>التخصص (Filière)</label>
                <select id="major" required>
                    <option value="">-- اختر التخصص --</option>
                    <option value="BA">Banque Assurance (BA)</option>
                    <option value="FC">Finance Comptabilité (FC)</option>
                    <option value="GRH">Gestion des RH (GRH)</option>
                    <option value="IG">Informatique de Gestion (IG)</option>
                    <option value="TCM">Techniques Commerciales (TCM)</option>
                    <option value="SAE">Secrétariat et Administration (SAE)</option>
                </select>
            </div>

            <div class="form-group">
                <label>المستوى (Niveau)</label>
                <select id="level" onchange="updateSemesters()" required>
                    <option value="">-- اختر المستوى --</option>
                    <option value="L1">Licence 1 (L1)</option>
                    <option value="L2">Licence 2 (L2)</option>
                    <option value="L3">Licence 3 (L3)</option>
                </select>
            </div>

            <div class="form-group">
                <label>الفصل (Semestre)</label>
                <select id="semester" required>
                    <option value="">-- اختر المستوى أولاً --</option>
                </select>
            </div>

            <div class="form-group">
                <label>رقم التسجيل (Matricule)</label>
                <input type="text" id="matricule" placeholder="مثال: I21180" style="text-transform: uppercase; text-align: left; direction: ltr;">
            </div>

            <div class="btn-group">
                <button type="button" class="btn-search" onclick="searchStudent()">🔍 عرض النتيجة</button>
                <button type="button" class="btn-top20" onclick="showTop20()">🏆 العشرون الأوائل</button>
            </div>
        </form>
        <div id="loader" class="loader">⏳ جاري الاتصال بـ GitHub وجلب البيانات...</div>
        <div id="error-msg" class="error"></div>
    </div>

    <!-- بطاقة نتيجة الطالب -->
    <div id="student-result" class="result-card">
        <div class="student-info">
            <h2 id="res-name">اسم الطالب</h2>
            <div class="info-row"><span>رقم التسجيل:</span> <span id="res-id" class="info-val"></span></div>
            <div class="info-row"><span>المعدل العام:</span> <span id="res-avg" class="info-val" style="color:var(--primary); font-size:1.3rem;"></span></div>
            <div class="info-row"><span>الترتيب:</span> <span id="res-rank" class="info-val" style="color:var(--secondary);"></span></div>
            <div class="info-row"><span>القرار:</span> <span id="res-dec" class="info-val"></span></div>
        </div>
        
        <a id="download-link" href="#" target="_blank" class="download-btn">
            📥 تنزيل النتيجة بالتفصيل (PDF)
        </a>
    </div>

    <!-- جدول الأوائل -->
    <div id="top20-container" class="result-card">
        <h2 style="color:var(--primary); text-align:center;">🏆 قائمة العشرون الأوائل</h2>
        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Matricule</th>
                        <th>Nom et Prénom</th>
                        <th>Moyenne</th>
                    </tr>
                </thead>
                <tbody id="top20-body"></tbody>
            </table>
        </div>
    </div>

</div>

<script>
    // ==========================================
    // ⚠️ إعدادات المستودع الخاصة بك ⚠️
    // ==========================================
    const GITHUB_USERNAME = "agwfmhmd-max";
    const REPO_NAME = "Resultat-ISCAE";
    // ==========================================

    const semsData = {
        'L1': {'S1':'Semestre 1', 'S2':'Semestre 2'},
        'L2': {'S3':'Semestre 3', 'S4':'Semestre 4'},
        'L3': {'S5':'Semestre 5', 'S6':'Semestre 6'}
    };

    function updateSemesters() {
        const lvl = document.getElementById('level').value;
        const semSelect = document.getElementById('semester');
        semSelect.innerHTML = '<option value="">-- اختر الفصل --</option>';
        if(lvl && semsData[lvl]) {
            for(let key in semsData[lvl]) {
                let opt = document.createElement('option');
                opt.value = key;
                opt.text = semsData[lvl][key];
                semSelect.appendChild(opt);
            }
        }
    }

    // --- بناء رابط GitHub Raw للفرع ---
    function getFileUrls() {
        const branchName = document.getElementById('major').value; // اسم الفرع = اسم التخصص
        const lvl = document.getElementById('level').value;
        const sem = document.getElementById('semester').value;
        
        if(!branchName || !lvl || !sem) {
            showError("الرجاء اختيار التخصص، المستوى والفصل.");
            return null;
        }

        // اسم الملف يجب أن يكون دقيقاً كما سترفعه
        // مثال: L1_S1_Classement.pdf
        const fileNameBase = `${lvl}_${sem}`;
        
        // الرابط المباشر للملف في الفرع الآخر
        const baseUrl = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${REPO_NAME}/${branchName}`;

        return {
            rankingUrl: `${baseUrl}/${fileNameBase}_Classement.pdf`,
            resultsUrl: `${baseUrl}/${fileNameBase}_Resultats.pdf`
        };
    }

    function showError(msg) {
        const err = document.getElementById('error-msg');
        err.style.display = 'block';
        err.innerText = msg;
        document.getElementById('loader').style.display = 'none';
    }

    function resetView() {
        document.getElementById('student-result').style.display = 'none';
        document.getElementById('top20-container').style.display = 'none';
        document.getElementById('error-msg').style.display = 'none';
    }

    // --- استخراج البيانات من ملف PDF ---
    async function fetchRankingData(pdfUrl) {
        document.getElementById('loader').style.display = 'block';
        try {
            const loadingTask = pdfjsLib.getDocument(pdfUrl);
            const pdf = await loadingTask.promise;
            let students = [];

            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                
                let lines = {};
                textContent.items.forEach(item => {
                    const y = Math.round(item.transform[5]);
                    if(!lines[y]) lines[y] = [];
                    lines[y].push({ str: item.str, x: item.transform[4] });
                });

                const sortedY = Object.keys(lines).sort((a,b) => b-a);
                
                sortedY.forEach(y => {
                    const lineItems = lines[y].sort((a,b) => a.x - b.x);
                    const lineStr = lineItems.map(t => t.str).join(" ").trim();
                    
                    // تحليل سطر الطالب (الترتيب، الرقم، الاسم، المعدل، القرار)
                    const match = lineStr.match(/^(\d+)\s+(I\d{4,})\s+(.+?)\s+(\d{1,2}[.,]\d{2})\s+(\w+)$/i);
                    
                    if(match) {
                        students.push({
                            rank: parseInt(match[1]),
                            id: match[2].toUpperCase(),
                            name: match[3],
                            avg: match[4],
                            decision: match[5]
                        });
                    }
                });
            }
            
            document.getElementById('loader').style.display = 'none';
            return students;

        } catch (e) {
            console.error(e);
            showError("فشل تحميل الملف. تأكد من أن الفرع (Branch) يحمل اسم التخصص بالضبط (مثل BA) وأن الملفات داخله تحمل الاسم الصحيح (مثل L1_S1_Classement.pdf).");
            return null;
        }
    }

    async function searchStudent() {
        resetView();
        const urls = getFileUrls();
        if(!urls) return;

        const matricule = document.getElementById('matricule').value.trim().toUpperCase();
        if(!matricule) { showError("الرجاء إدخال رقم التسجيل."); return; }

        const students = await fetchRankingData(urls.rankingUrl);
        if(!students) return;

        const student = students.find(s => s.id === matricule);

        if(student) {
            document.getElementById('res-name').innerText = student.name;
            document.getElementById('res-id').innerText = student.id;
            document.getElementById('res-avg').innerText = student.avg;
            document.getElementById('res-rank').innerText = student.rank;
            
            const decEl = document.getElementById('res-dec');
            decEl.innerText = student.decision;
            
            const decText = student.decision.toLowerCase();
            if(decText.includes('valid') || decText.includes('admis')) {
                decEl.className = 'info-val decision-valid';
            } else {
                decEl.className = 'info-val decision-ratt';
            }

            const linkBtn = document.getElementById('download-link');
            linkBtn.href = urls.resultsUrl; // الرابط المباشر لملف النتائج من الفرع
            
            document.getElementById('student-result').style.display = 'block';
        } else {
            showError("رقم التسجيل غير موجود في هذا التخصص.");
        }
    }

    async function showTop20() {
        resetView();
        const urls = getFileUrls();
        if(!urls) return;

        const students = await fetchRankingData(urls.rankingUrl);
        if(!students) return;

        students.sort((a,b) => a.rank - b.rank);
        const top20 = students.slice(0, 20);

        const tbody = document.getElementById('top20-body');
        tbody.innerHTML = '';

        if(top20.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">لا توجد بيانات.</td></tr>';
        } else {
            top20.forEach(s => {
                const row = `
                    <tr>
                        <td><b>${s.rank}</b></td>
                        <td>${s.id}</td>
                        <td>${s.name}</td>
                        <td style="color:var(--primary); font-weight:bold;">${s.avg}</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        document.getElementById('top20-container').style.display = 'block';
    }

</script>

</body>
</html>
